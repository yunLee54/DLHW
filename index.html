<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 영어 학습 앱</title>

    <!-- CSS: Change how the app looks -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial;
            text-align: center;
            /* 화면 전체를 기준으로 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #quizBox {
            width: 90%;
            max-width: 500px;
            padding: 30px;
        }

        button {
            font-size: 20px;
            padding: 12px;
            margin: 5px;
            background-color: lightgreen;
            cursor: pointer;
        }

        .answerBtn {
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        #feedback {
            min-height: 30px;
        }

        #nextBtn {
            display: none;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->
    <div id="quizBox">

        <h1>Vocabulary Quiz</h1>

        <p id="progress"></p>
        <p id="question" style="font-size: 22px;"></p>

        <div id="choices"></div>

        <h3 id="feedback"></h3>

        <button id="nextBtn" onclick="nextQuestion()">다음 문제</button>

    </div>


    <!-- JavaScript: Change what happens -->
    <script>

        // 문제 목록: 단어, 보기 3개, 정답 (정답 위치는 문제마다 다르게 했어요)
        var questions = [
            {
                word: "Avoid",
                choices: ["Stay away from", "Join in", "Look at"],
                answer: "Stay away from"
            },
            {
                word: "Participate in",
                choices: ["Stay away from", "Take part in", "Look at"],
                answer: "Take part in"
            },
            {
                word: "Borrow",
                choices: ["Give back", "Take and use for a short time", "Buy"],
                answer: "Take and use for a short time"
            },
            {
                word: "Protect",
                choices: ["Keep safe", "Break", "Forget"],
                answer: "Keep safe"
            },
            {
                word: "Improve",
                choices: ["Make worse", "Make better", "Make smaller"],
                answer: "Make better"
            }
        ];

        var current = 0;
        var score = 0;

        function showQuestion() {
            var q = questions[current];

            document.getElementById("progress").innerText =
                "문제 " + (current + 1) + " / " + questions.length;
            document.getElementById("question").innerText =
                'What does "' + q.word + '" mean?';
            document.getElementById("feedback").innerText = "";
            document.getElementById("nextBtn").style.display = "none";

            var choicesDiv = document.getElementById("choices");
            choicesDiv.innerHTML = "";

            for (var i = 0; i < q.choices.length; i++) {
                var btn = document.createElement("button");
                btn.className = "answerBtn";
                btn.innerText = q.choices[i];
                btn.setAttribute("data-choice", q.choices[i]);
                btn.onclick = function () {
                    checkAnswer(this.getAttribute("data-choice"));
                };
                choicesDiv.appendChild(btn);
            }
        }

        function checkAnswer(answer) {
            var q = questions[current];

            // 한 번 고르면 다시 못 누르게 버튼 잠그기
            var buttons = document.querySelectorAll(".answerBtn");
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
            }

            if (answer === q.answer) {
                score++;
                document.getElementById("feedback").innerText =
                    "잘했어, 정답이야!";
            } else {
                document.getElementById("feedback").innerText =
                    "틀렸어, 답은 " + q.answer + "야.";
            }

            var nextBtn = document.getElementById("nextBtn");
            nextBtn.style.display = "inline-block";
            nextBtn.innerText =
                (current === questions.length - 1) ? "결과 보기" : "다음 문제";
        }

        function nextQuestion() {
            current++;

            if (current < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("progress").innerText = "";
            document.getElementById("question").innerText =
                "퀴즈 끝! " + questions.length + "문제 중 " + score + "문제를 맞혔어요.";
            document.getElementById("choices").innerHTML = "";
            document.getElementById("feedback").innerText = "";

            var nextBtn = document.getElementById("nextBtn");
            nextBtn.innerText = "다시 하기";
            nextBtn.onclick = restart;
        }

        function restart() {
            current = 0;
            score = 0;
            var nextBtn = document.getElementById("nextBtn");
            nextBtn.onclick = nextQuestion;
            showQuestion();
        }

        showQuestion();

    </script>

</body>
</html>
