<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>나의 첫 영어 학습 앱</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 20px;
            padding: 12px;
            margin: 5px;
            background-color: lightgreen; /* 버튼 색상: 여기를 바꾸면 색이 달라져요 */
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>나의 첫 영어 학습 앱</h1>

    <p>What does "avoid" mean?</p>

    <button onclick="checkAnswer('participate')">
        To join in
    </button>

    <button onclick="checkAnswer('avoid')">
        To stay away from
    </button>

    <button onclick="checkAnswer('watch')">
        To look at
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "avoid") {
                document.getElementById("feedback").innerText =
                    "Correct! Well done!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "Incorrect. The answer is To stay away from.";
            }

        }

    </script>

</body>
</html>
