<!DOCTYPE html>
<html>

<head>
    <title>나의 첫 영어 학습 앱</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 20px;
            padding: 12px;
            margin: 5px;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "Avoid" mean?</p>

    <button onclick="checkAnswer('Avoid')">
        Avoid
    </button>

    <button onclick="checkAnswer('Participate in')">
        Participate in
    </button>
        
    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "Avoid") {
                document.getElementById("feedback").innerText =
                    "잘했어, 정답이야!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "틀렸어, 답은 Avoid야.";
            }

        }

    </script>

</body>
</html>
